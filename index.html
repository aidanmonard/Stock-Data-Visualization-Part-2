<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Data Visualization</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 32px 16px; background: #f3f5f8;
            color: #202938; font-family: Arial, sans-serif;
        }
        main {
            max-width: 950px; margin: auto; background: white;
            padding: 28px; border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,.08);
        }
        h1 { margin-top: 0; color: #17365d; }
        .intro { color: #5b6573; }
        form {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px; margin-top: 25px;
        }
        label { display: block; font-weight: bold; margin-bottom: 7px; }
        select, input {
            width: 100%; padding: 11px; border: 1px solid #cbd2dc;
            border-radius: 6px; background: white; font-size: 15px;
        }
        button {
            grid-column: 1 / -1; padding: 13px; border: 0;
            border-radius: 6px; background: #1769aa; color: white;
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        button:hover { background: #105487; }
        .message { margin-top: 20px; padding: 13px; border-radius: 6px; }
        .error { background: #fdecec; color: #9b1c1c; }
        .chart { margin-top: 28px; }
        .chart img { width: 100%; height: auto; border: 1px solid #e1e5eb; }
        @media (max-width: 620px) {
            form { grid-template-columns: 1fr; }
            main { padding: 20px; }
        }
    </style>
</head>
<body>
<main>
    <h1>Stock Data Visualization</h1>
    <p class="intro">
        Choose a company, chart type, time series, and date range to view
        historical stock prices.
    </p>

    <form method="POST">
        <div>
            <label for="symbol">Stock Symbol</label>
            <select id="symbol" name="symbol" required>
                <option value="">Choose a company</option>
                {% for stock in stocks %}
                <option value="{{ stock.symbol }}"
                    {% if selected.symbol == stock.symbol %}selected{% endif %}>
                    {{ stock.symbol }} - {{ stock.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="chart_type">Chart Type</label>
            <select id="chart_type" name="chart_type">
                {% for key, name in chart_types.items() %}
                <option value="{{ key }}"
                    {% if selected.chart_type == key %}selected{% endif %}>
                    {{ name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="time_series">Time Series</label>
            <select id="time_series" name="time_series">
                {% for key, item in time_series.items() %}
                <option value="{{ key }}"
                    {% if selected.time_series == key %}selected{% endif %}>
                    {{ item[0] }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="start_date">Beginning Date</label>
            <input type="date" id="start_date" name="start_date"
                   value="{{ selected.start_date }}" required>
        </div>

        <div>
            <label for="end_date">Ending Date</label>
            <input type="date" id="end_date" name="end_date"
                   value="{{ selected.end_date }}" required>
        </div>

        <button type="submit">Generate Stock Chart</button>
    </form>

    {% if error %}
    <div class="message error" role="alert">{{ error }}</div>
    {% endif %}

    {% if chart_image %}
    <section class="chart">
        <h2>{{ selected.symbol }} Stock Chart</h2>
        <img src="data:image/png;base64,{{ chart_image }}"
             alt="Stock price chart for {{ selected.symbol }}">
    </section>
    {% endif %}
</main>
</body>
</html>
